name: build-and-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # jpackage для Windows-сборки — только на windows-раннере
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build jar
        run: mvn -B -q package

      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $ver = "$env:GITHUB_REF_NAME" -replace '^v', ''
          if (-not $ver) { $ver = '0.0.0' }
          Write-Host "release notes for $ver"
          New-Item -ItemType Directory -Force -Path build\notes | Out-Null
          javac -encoding UTF-8 -cp target\classes -d build\notes tools\ReleaseNotes.java
          if ($LASTEXITCODE -ne 0) { throw "ReleaseNotes не собрался" }
          java -cp "target\classes;build\notes" ReleaseNotes $ver
          if ($LASTEXITCODE -ne 0) { throw "ReleaseNotes не отработал" }

      - name: Build portable app image
        run: |
          $ver = "$env:GITHUB_REF_NAME" -replace '^v', ''
          if ($ver -notmatch '^\d+(\.\d+){0,2}$') { $ver = '1.0.0' }
          Write-Host "app-version: $ver"
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item target\FrimerLauncher.jar staging\
          jpackage --type app-image --name "Frimer Launcher" --app-version $ver --input staging --main-jar FrimerLauncher.jar --main-class com.frimer.launcher.Main --icon packaging\frimer.ico --dest dist --vendor Frimer
          if ($LASTEXITCODE -ne 0) { throw "jpackage не собрал приложение" }
          Compress-Archive -Path "dist\Frimer Launcher\*" -DestinationPath "FrimerLauncher-win64.zip" -Force
          Write-Host ("exe: " + (Get-Item "dist\Frimer Launcher\Frimer Launcher.exe").Length + " bytes")
          Write-Host ("zip: " + (Get-Item "FrimerLauncher-win64.zip").Length + " bytes")

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrimerLauncher-jar
          path: target/FrimerLauncher.jar

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrimerLauncher-win64
          path: FrimerLauncher-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/FrimerLauncher.jar
            FrimerLauncher-win64.zip
          body_path: changes.md
