name: build-and-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build jar
        run: mvn -B -q package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrimerLauncher
          path: target/FrimerLauncher.jar

      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          python3 - "$VER" <<'EOF'
          import re, sys

          ver = sys.argv[1]
          src = open("src/main/java/com/frimer/launcher/core/Changelog.java",
                     encoding="utf-8").read()
          # Запись о версии: new Entry("<ver>", "<дата>", List.of( ... ))
          m = re.search(r'new Entry\("' + re.escape(ver) + r'", "([^"]*)", List\.of\((.*?)\)\)',
                        src, re.S)

          lines = [
              f"## Frimer Launcher {ver}",
              "",
              "Minecraft-лаунчер: Vanilla / Fabric / Quilt / Forge / NeoForge, сервера, скины,",
              "моды и браузер Modrinth.",
              "",
          ]
          if m:
              date = m.group(1)
              changes = re.findall(r'"((?:[^"\\]|\\.)*)"', m.group(2))
              changes = [c.replace('\\\\', '\\') for c in changes]
              lines.append(f"### Что нового в {ver} ({date})")
              lines += [f"- {c}" for c in changes]
          else:
              lines.append("### Что нового")
              lines.append("- (нет записи в журнале изменений)")

          # Всё в одном файле: body_path полностью заменяет body в action-gh-release.
          lines += [
              "",
              "### Как запустить",
              "1. Скачайте `FrimerLauncher.jar` ниже.",
              "2. Нужна **Java 17 или новее** (проверить: `java -version`).",
              "3. Запустите:",
              "",
              "```bat",
              "java -jar FrimerLauncher.jar",
              "```",
              "",
              "Данные лежат в `~/.frimerlauncher` (`C:\\Users\\<имя>\\.frimerlauncher`) — сборки,",
              "сервера и настройки из Python-версии подхватываются сами.",
              "",
              "> Windows SmartScreen может предупредить о неизвестном издателе — это обычное",
              "> поведение для jar без цифровой подписи, «Подробнее» → «Выполнить в любом случае».",
          ]

          text = "\n".join(lines) + "\n"
          with open("changes.md", "w", encoding="utf-8") as f:
              f.write(text)
          print(text)
          EOF

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/FrimerLauncher.jar
          body_path: changes.md
