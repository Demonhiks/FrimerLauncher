name: build-and-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.os }})
    # Одна упавшая платформа не должна блокировать остальные
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: FrimerLauncher-win64.zip
          - os: ubuntu-latest
            asset: FrimerLauncher-linux-x64.tar.gz
          - os: macos-15
            asset: FrimerLauncher-macos-arm64.zip
          - os: macos-15-intel
            asset: FrimerLauncher-macos-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build jar
        run: mvn -B -q package

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "$env:GITHUB_REF_NAME" -replace '^v', ''
          if ($ver -notmatch '^\d+(\.\d+){0,2}$') { $ver = '1.0.0' }
          Write-Host "app-version: $ver"
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item target\FrimerLauncher.jar staging\
          jpackage --type app-image --name "Frimer Launcher" --app-version $ver --input staging --main-jar FrimerLauncher.jar --main-class com.frimer.launcher.Main --icon packaging\frimer.ico --dest dist --vendor Frimer
          if ($LASTEXITCODE -ne 0) { throw "jpackage не собрал приложение" }
          Compress-Archive -Path "dist\Frimer Launcher\*" -DestinationPath "${{ matrix.asset }}" -Force
          Write-Host ("asset: " + (Get-Item "${{ matrix.asset }}").Length + " bytes")

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [[ "$VER" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || VER=1.0.0
          echo "app-version: $VER"
          mkdir -p staging && cp target/FrimerLauncher.jar staging/
          jpackage --type app-image --name "Frimer Launcher" --app-version "$VER" --input staging --main-jar FrimerLauncher.jar --main-class com.frimer.launcher.Main --icon packaging/frimer.png --dest dist --vendor Frimer
          if [ $? -ne 0 ]; then echo "jpackage failed"; exit 1; fi
          # папка без пробелов + скрипт запуска: в консоли это удобнее
          mv "dist/Frimer Launcher" "dist/frimer-launcher"
          printf '%s\n' '#!/bin/sh' \
            '# Frimer Launcher — запуск без установки Java' \
            'cd "$(dirname "$0")" || exit 1' \
            'exec "./bin/Frimer Launcher" "$@"' > "dist/frimer-launcher/run.sh"
          chmod +x "dist/frimer-launcher/run.sh"
          printf '%s\n' \
            'Frimer Launcher (Linux x64)' \
            '' \
            'Запуск:' \
            '  ./run.sh' \
            '' \
            'Или напрямую:' \
            '  "./bin/Frimer Launcher"' \
            '' \
            'Java устанавливать не нужно — она лежит в lib/runtime.' \
            'Данные: ~/.frimerlauncher' > "dist/frimer-launcher/README.txt"
          tar -czf "${{ matrix.asset }}" -C dist frimer-launcher
          tar -tzf "${{ matrix.asset }}" | sed -n '1,5p'
          ls -lh "${{ matrix.asset }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [[ "$VER" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || VER=1.0.0
          echo "app-version: $VER"
          mkdir -p staging && cp target/FrimerLauncher.jar staging/
          jpackage --type app-image --name "Frimer Launcher" --app-version "$VER" --input staging --main-jar FrimerLauncher.jar --main-class com.frimer.launcher.Main --icon packaging/frimer.icns --dest dist --vendor Frimer
          # ditto сохраняет симлинки и биты запуска внутри .app
          ditto -c -k --sequesterRsrc --keepParent "dist/Frimer Launcher.app" "${{ matrix.asset }}"
          ls -lh "${{ matrix.asset }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Upload jar
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: FrimerLauncher-jar
          path: target/FrimerLauncher.jar

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mvn -B -q package
          mkdir -p build/notes
          javac -encoding UTF-8 -cp target/classes -d build/notes tools/ReleaseNotes.java
          java -cp "target/classes:build/notes" ReleaseNotes "$VER"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FrimerLauncher.jar
            FrimerLauncher-win64.zip
            FrimerLauncher-linux-x64.tar.gz
            FrimerLauncher-macos-arm64.zip
            FrimerLauncher-macos-x64.zip
          body_path: changes.md
